# Audio Detection Training Configuration
# Note: Audio dataset has ~1993 images (vs ~112 for CCTV) - expect longer training

epochs: 5
batch_size: 8  # Increase if GPU memory allows (RTX 4070 has 8GB)
imgsz: 640
workers: 4  # Increase for faster data loading
project: "audio_detection"
name: "run_1"

# Enable AMP for faster training (RTX 4070 supports it well)
amp: true

# Optimizer settings
optimizer: "AdamW"
lr: 0.0001
weight_decay: 0.0001
lr_scheduler_name: "StepLR"
step_size: 10  # Reduced for more frequent LR decay
gamma: 0.1
