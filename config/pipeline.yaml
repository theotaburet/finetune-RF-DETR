name: rf_detr_pipeline
description: RF-DETR Audio Event Detection Pipeline

# Class names - ORDER MATTERS! Index = Class ID (0-based)
# Example for marine acoustics:
# class_names: ["humpback_whale", "killer_whale", "blue_whale", "dolphin", "ship_noise", "fish_chorus"]
#   → humpback_whale = class 0, killer_whale = class 1, etc.
#
# These MUST match the classes in merging.yaml (e.g., classes.0, classes.1)
# class_names: ["mysticeti"]
class_names: []
classes_file: null

# Download step - fetches labeled audio from EKB API
# Full config lives in config/download.yaml
download:
  enabled: true
  config_file: config/download.yaml
  max_labels: null  # Override limit.max_labels from download.yaml (null = use yaml value)
  force: false      # Re-download even if data already exists

# Preprocess step - converts audio + metadata → spectrogram chunks + COCO annotations
# Full config lives in config/preprocess.yaml
preprocess:
  enabled: false
  config_file: config/preprocess.yaml

# Split step - splits processed dataset into train / val / test
# Full config lives in config/split.yaml
split:
  enabled: false
  config_file: config/split.yaml

# Train step - fine-tunes RF-DETR on the split dataset
# Full config lives in config/train.yaml
train:
  enabled: true
  config_file: config/train.yaml

# Evaluate step - runs inference on the test split and reports COCO metrics
# Full config lives in config/evaluate.yaml
evaluate:
  enabled: false
  config_file: config/evaluate.yaml

# Infer step - runs the trained model on new audio files
# Full config lives in config/infer.yaml
infer:
  enabled: false
  config_file: config/infer.yaml
