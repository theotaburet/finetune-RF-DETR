# Event Merging Configuration
# Controls how detections from overlapping chunks are merged into coherent events

# Default merge parameters (applied to all classes unless overridden)
default:
  # Maximum temporal distance to merge events (milliseconds)
  # Events within this time window will be considered for merging
  delta_time_ms: 500.0

  # Maximum frequency distance to merge events (Hz)
  # Events within this frequency window will be considered for merging
  delta_freq_hz: 500.0

  # Alternative: use overlap ratio instead of delta_time_ms
  # Set to null to use delta_time_ms, or a value (0.0-1.0) for overlap-based merging
  min_overlap_ratio: null

  # Score combination strategy
  # - "max": Take maximum score from merged events
  # - "avg": Average scores
  # - "weighted": Weight by duration
  score_strategy: "max"

# Class-specific merge parameters
# Each class can have different merge behavior based on sound characteristics
classes:
  # bird_call: Short, distinct calls with tight temporal requirements
  0:
    delta_time_ms: 300
    delta_freq_hz: 500
    min_overlap_ratio: null
    score_strategy: "max"

  # engine_noise: Long continuous sound, allow larger temporal gaps
  1:
    delta_time_ms: 800
    delta_freq_hz: 200
    min_overlap_ratio: null
    score_strategy: "avg"

  # dog_bark: Medium duration sounds
  2:
    delta_time_ms: 500
    delta_freq_hz: 300
    min_overlap_ratio: null
    score_strategy: "weighted"

# Post-merge filtering
filtering:
  # Minimum score to keep merged events (0.0-1.0)
  score_threshold: 0.0

  # Minimum event duration in milliseconds
  min_duration_ms: 0.0

  # Maximum event duration in milliseconds (null = no limit)
  max_duration_ms: null

# Input/Output settings
input:
  # Path to input events JSON file (COCO format or EventList format)
  # Can be single file or directory
  events_file: null

  # Alternative: provide predictions from inference
  predictions_file: null

output:
  # Output directory for merged events
  output_dir: "output/merged_events"

  # Output format
  format: "json"  # Options: json, csv

  # Save visualization
  save_visualization: true
