# Event Merging Configuration for Underwater Acoustics
# Controls how detections from overlapping chunks are merged into coherent events
# Optimized for marine mammals, fish, and anthropogenic sounds
#
# IMPORTANT: The class IDs here (0, 1, 2, etc.) MUST match the class_names
# order in config/pipeline.yaml and the model's output classes.
#
# Example mapping:
#   pipeline.yaml: class_names: ["humpback_whale", "killer_whale", "blue_whale"]
#   merging.yaml:  classes.0 = humpback_whale, classes.1 = killer_whale, etc.
#
# The integer keys in 'classes:' below correspond to the index in class_names.

# Default merge parameters (applied to all classes unless overridden)
default:
  # Maximum temporal distance to merge events (milliseconds)
  # Underwater sounds often have longer durations and slower repetition rates
  delta_time_ms: 2000.0

  # Maximum frequency distance to merge events (Hz)
  # Marine sounds typically span narrower frequency bands
  delta_freq_hz: 150.0

  # Alternative: use overlap ratio instead of delta_time_ms
  min_overlap_ratio: null

  # Score combination strategy
  score_strategy: "max"

# Class-specific merge parameters for marine species
classes:
  # Humpback whale: Complex songs with frequency sweeps (10 Hz - 4 kHz)
  # Long continuous phrases that may have gaps
  0:
    delta_time_ms: 3000       # Allow 3s gaps for continuous songs
    delta_freq_hz: 400        # Tolerance for frequency sweeps
    score_strategy: "max"

  # Killer whale: Pulsed calls and echolocation clicks (1-20 kHz)
  # Short discrete calls, tight temporal grouping
  1:
    delta_time_ms: 800        # Tight tolerance for discrete calls
    delta_freq_hz: 600        # Broadband clicks
    score_strategy: "max"

  # Blue whale: Very long, infrasonic calls (10-40 Hz)
  # Long duration, extremely low frequency
  2:
    delta_time_ms: 8000       # Very long tolerance (8s)
    delta_freq_hz: 30         # Very narrow frequency band
    score_strategy: "avg"

  # Dolphin: Echolocation clicks and whistles (up to 150 kHz)
  # Rapid clicks, very short duration
  3:
    delta_time_ms: 400        # Very tight for rapid clicks
    delta_freq_hz: 800        # Wide frequency range
    score_strategy: "max"

  # Ship noise: Continuous broadband anthropogenic noise
  # Long duration, may vary slowly
  4:
    delta_time_ms: 5000       # Long tolerance for continuous noise
    delta_freq_hz: 100        # Narrow band
    score_strategy: "avg"

  # Fish chorus: Rhythmic, repetitive grunts/knocks
  # Moderate duration, rhythmic patterns
  5:
    delta_time_ms: 2000
    delta_freq_hz: 200
    score_strategy: "weighted"

# Post-merge filtering
filtering:
  # Minimum score to keep merged events
  score_threshold: 0.3

  # Minimum event duration (marine sounds are often >200ms)
  min_duration_ms: 200.0

  # Maximum event duration (null = no limit)
  max_duration_ms: null

output:
  output_dir: "output/merged_events"
  format: "json"
  save_visualization: true
